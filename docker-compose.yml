services:
  postgres:
    image: postgres:16
    container_name: orangchat-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: orangchat
      POSTGRES_PASSWORD: orangchat
      POSTGRES_DB: orangchat
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - orangchat_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orangchat -d orangchat"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: orangchat-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - orangchat_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  orangchat_pgdata:
  orangchat_redisdata:
