server {
    listen 80;
    listen [::]:80;
    server_name livekit.oranges.lt;

    include snippets/env-easter-egg.conf;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name livekit.oranges.lt;

    include snippets/env-easter-egg.conf;

    ssl_certificate /etc/letsencrypt/live/livekit.oranges.lt/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/livekit.oranges.lt/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:livekit_SSL:10m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        proxy_pass http://127.0.0.1:7880;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    access_log /var/log/nginx/livekit.oranges.lt.access.log;
    error_log /var/log/nginx/livekit.oranges.lt.error.log;
}
