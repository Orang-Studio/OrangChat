server {
    listen 80;
    listen [::]:80;
    server_name chat.oranges.lt;

    include snippets/env-easter-egg.conf;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name chat.oranges.lt;

    include snippets/env-easter-egg.conf;

    ssl_certificate /etc/letsencrypt/live/chat.oranges.lt/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chat.oranges.lt/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/chat.oranges.lt/chain.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:chat_SSL:10m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # docs/E2EE.md §10.6. The page now holds decrypted DMs, so what matters is
    # where bytes can *leave* to, not only what can run. `connect-src` and
    # `img-src` are the load-bearing directives and they are not plugin-specific:
    # they stop exfiltration whether the code arrived via a bad plugin PR, a
    # community theme, a profile stylesheet or a markdown XSS.
    #
    # `img-src` is the one people forget. CSS alone is an exfiltration channel -
    # an attribute selector plus `background: url(https://attacker/…)` leaks
    # decrypted message text with no JavaScript involved at all, which
    # sandboxing plugins would not fix and this does.
    #
    # 'unsafe-inline' stays on style-src because community themes, profile CSS
    # and `User.customCss` are injected as inline stylesheets; that is a known
    # cost, and img-src is what keeps it from being an exfiltration primitive.
    # 'wasm-unsafe-eval' is LiveKit's audio processing.
    set $oc_csp "default-src 'self'";
    set $oc_csp "$oc_csp; base-uri 'self'";
    set $oc_csp "$oc_csp; object-src 'none'";
    set $oc_csp "$oc_csp; frame-ancestors 'none'";
    set $oc_csp "$oc_csp; form-action 'self'";
    set $oc_csp "$oc_csp; script-src 'self' 'wasm-unsafe-eval' https://www.google.com https://www.gstatic.com";
    set $oc_csp "$oc_csp; style-src 'self' 'unsafe-inline'";
    set $oc_csp "$oc_csp; font-src 'self' data:";
    # Same-origin plus the media proxy's own scheme. Remote embeds and og:images
    # are already routed through /api/media/proxy, so no third-party image host
    # belongs here - adding one would reopen the zero-click IP log as well.
    set $oc_csp "$oc_csp; img-src 'self' data: blob:";
    set $oc_csp "$oc_csp; media-src 'self' data: blob:";
    set $oc_csp "$oc_csp; worker-src 'self' blob:";
    # The API and Socket.IO are same-origin; LiveKit's SFU and the GIF search are
    # the only two places the page legitimately talks to another host.
    set $oc_csp "$oc_csp; connect-src 'self' wss://chat.oranges.lt wss://livekit.oranges.lt https://livekit.oranges.lt https://api.klipy.com https://www.google.com";
    set $oc_csp "$oc_csp; frame-src https://www.youtube-nocookie.com https://www.google.com";
    add_header Content-Security-Policy $oc_csp always;

    client_max_body_size 50m;

    root /var/www/chat.oranges.lt;
    index index.html;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The HTML shell points at content-hashed assets and the service worker owns
    # notification crypto. Both must be revalidated on every navigation/update;
    # caching either can leave an already-installed client on pre-deploy code.
    # `expires -1` emits no-cache without introducing a location-level
    # `add_header`, which would suppress the inherited CSP/security headers.
    location = /index.html {
        expires -1;
    }

    location = /sw.js {
        expires -1;
    }

    # Digital Asset Links: what lets Android verify that this site and the app
    # signed with the fingerprint inside are the same party, so /invite/ links
    # open the app directly instead of prompting. Android fetches it over https
    # with no redirects and insists on the JSON content type.
    location = /.well-known/assetlinks.json {
        alias /var/www/chat.oranges.lt/.well-known/assetlinks.json;
        default_type application/json;
        add_header Cache-Control "public, max-age=3600";
    }

    # Sideloaded Android builds. The app polls update.json and pulls the APK
    # itself (feature/updates/UpdateManager.kt); both files are published here
    # by android's `./gradlew publishUpdate`. Public on purpose - this is the
    # only distribution channel, and the APK's signature is what proves it
    # genuine, not who is allowed to fetch it.
    location /download/android/ {
        # nginx's mime.types has no apk entry; without this it lands as
        # octet-stream and some clients balk at handing it to the installer.
        types { application/vnd.android.package-archive apk; }
        default_type application/octet-stream;
        # The filename carries the version, so a given APK never changes.
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Exact-match wins over the prefix above. The manifest is the freshness
    # signal: cache it and clients stay blind to a new release for as long as
    # the cache lives.
    location = /download/android/update.json {
        default_type application/json;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Windows desktop shell (packages/desktop). Public for the same reason as
    # the APKs above. NOT code-signed, so SmartScreen warns on first run.
    location /download/windows/ {
        default_type application/octet-stream;
        # The filename carries the version, so a given build never changes.
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Exact-match wins over the prefix above. Same reasoning as the Android
    # update.json: this is the freshness signal electron-updater polls, so
    # caching it would strand clients on an old version.
    location = /download/windows/latest.yml {
        default_type text/yaml;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location /download/linux/ {
        default_type application/octet-stream;
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /download/linux/latest-linux.yml {
        default_type text/yaml;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Every stored name is a fresh cuid (store_media in http/uploads.rs), so a
    # path never names different bytes - changing an avatar mints a new url
    # rather than overwriting the old one. `immutable` says exactly that, which
    # stops browsers revalidating every avatar and emoji on each page load.
    location /uploads/ {
        alias /var/lib/orangchat/uploads/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        # User-uploaded content: never let the browser MIME-sniff it into
        # something executable (defuses image/HTML polyglots).
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'" always;
    }

    # Message attachments (<= 10 MB; larger ones live on OrangMove, below).
    # Unlike /uploads/, these bytes were never decoded or re-encoded - whatever
    # the user picked is what's on disk - so they're served inert: forced as a
    # download, never sniffed, and under a CSP that can't run anything even if
    # someone navigates straight to one. The client supplies the real filename
    # via the download attribute; on-disk names are opaque ids.
    location /attachments/ {
        alias /var/lib/orangchat/attachments/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Disposition "attachment" always;
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
    }

    # Attachments over 10 MB go to OrangMove. Proxying here rather than sending
    # browsers to cdn.oranges.lt keeps it same-origin: OrangMove pins CORS to a
    # single APP_ORIGIN (move.oranges.lt), so a cross-origin upload from this
    # app would fail preflight. nginx streams straight to OrangMove - the bytes
    # never touch the OrangChat process.
    location /orangmove/ {
        proxy_pass http://127.0.0.1:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # OrangMove's own ceiling is 1 GiB; leave headroom for multipart framing.
        client_max_body_size 1100m;
        # Stream the upload through instead of spooling the whole file to disk
        # first, so a 1 GB send doesn't stall until it's fully received.
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # The backend's health probe lives at the root, outside /api. Exposed so the
    # apps (and external monitoring) can read status + version; exact-match keeps
    # it from shadowing the SPA fallback. Never cached - it's a liveness signal.
    location = /health {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store" always;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /socket.io/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        try_files $uri /index.html;
    }

    access_log /var/log/nginx/chat.oranges.lt.access.log;
    error_log /var/log/nginx/chat.oranges.lt.error.log;
}
