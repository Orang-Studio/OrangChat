# Catch scanners probing for leaked environment files, key.json, or
# secrets.json, including nested paths and env variants such as /.env.local
# and /env.production.
#
# The server-level check runs before generic HTTP-to-HTTPS returns. The location
# handles normal request routing in server blocks without an early return.
if ($uri ~* "(?:^|/)(?:\.?env(?:$|[./])|(?:key|secrets)\.json$)") {
    return 302 https://m.youtube.com/watch?v=xvFZjo5PgG0;
}

location ~* (?:^|/)(?:\.?env(?:$|[./])|(?:key|secrets)\.json$) {
    return 302 https://m.youtube.com/watch?v=xvFZjo5PgG0;
}
