appId: lt.oranges.orangchat
productName: OrangChat
copyright: Copyright © 2026 Oranges.LT
directories:
  output: release
  buildResources: build

npmRebuild: false
files:
  - dist/**/*
  - build/icon.png
  - build/badges/*.png
  - package.json
win:
  target:
    - target: nsis
      arch: [x64]
    - target: zip
      arch: [x64]
  icon: build/icon.ico
  artifactName: OrangChat-${version}-${arch}.${ext}
linux:
  target:
    - target: AppImage
      arch: [x64]
  icon: build/icon.png
  category: Network
  artifactName: OrangChat-${version}-${arch}.${ext}

publish:
  provider: generic
  url: https://chat.oranges.lt/download/windows
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: OrangChat
  artifactName: OrangChat-Setup-${version}.${ext}
  uninstallDisplayName: OrangChat
